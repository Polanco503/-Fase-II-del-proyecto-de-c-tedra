<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Restaurante</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
<main class="page">
    <section class="login-panel">
        <div>
            <p class="eyebrow">Restaurant API</p>
            <h1>Iniciar sesion</h1>
            <p class="intro">Accede al panel para probar roles y administrar productos.</p>
        </div>

        <form id="loginForm" class="form">
            <label>
                Email
                <input id="email" name="email" type="email" autocomplete="username" required>
            </label>

            <label>
                Password
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </label>

            <button type="submit">Entrar</button>
        </form>

        <div class="quick-users">
            <button type="button" data-email="admin@restaurant.com" data-password="Admin123!">Admin</button>
            <button type="button" data-email="mesero@restaurant.com" data-password="Mesero123!">Mesero</button>
            <button type="button" data-email="usuario@restaurant.com" data-password="Usuario123!">Usuario</button>
        </div>

        <p id="status" class="status">Sin sesion activa.</p>
    </section>
</main>
<script src="/js/login.js"></script>
</body>
</html>
