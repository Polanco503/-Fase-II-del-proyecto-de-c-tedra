<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel Restaurante</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<header class="topbar">
    <div>
        <p class="eyebrow">Restaurant API</p>
        <h1>Panel de control</h1>
    </div>
    <div class="session">
        <span id="sessionStatus">Sin sesion activa</span>
        <button id="logout" type="button" class="secondary">Cerrar sesion</button>
    </div>
</header>

<main class="layout">
    <section class="panel">
        <div class="section-heading">
            <h2>Pruebas de acceso</h2>
            <button id="showToken" type="button" class="secondary">Ver token</button>
        </div>
        <div class="actions">
            <button type="button" data-url="/api/admin/test">Admin</button>
            <button type="button" data-url="/api/mesero/test">Mesero</button>
            <button type="button" data-url="/api/usuario/test">Usuario</button>
        </div>
        <pre id="result">{}</pre>
    </section>

    <section class="panel">
        <div class="section-heading">
            <h2>Productos</h2>
            <button id="refreshProducts" type="button" class="secondary">Actualizar</button>
        </div>

        <form id="productForm" class="product-form">
            <input id="productId" type="hidden">
            <label>
                Nombre
                <input id="productName" type="text" required>
            </label>
            <label>
                Precio
                <input id="productPrice" type="number" min="0" step="0.01" required>
            </label>
            <label>
                Stock
                <input id="productStock" type="number" min="0" step="1" required>
            </label>
            <div class="form-actions">
                <button id="saveProduct" type="submit">Guardar</button>
                <button id="cancelEdit" type="button" class="secondary">Cancelar</button>
            </div>
        </form>

        <p id="adminNotice" class="notice"></p>
        <div id="products" class="products"></div>
    </section>
</main>

<script src="/js/dashboard.js"></script>
</body>
</html>
